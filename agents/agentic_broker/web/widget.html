<!--
  Relay "Buy with Agent" widget.
  Paste this entire file into a Shopify product-template Custom Liquid section.
  Replace YOUR-TUNNEL.trycloudflare.com with the public HTTPS buyer-agent URL.
-->
<relay-agent-buy
  agent-base-url="{{ agent_base_url | default: 'https://YOUR-TUNNEL.trycloudflare.com' | escape }}"
  product-query="{{ product_query | default: product.title | escape }}"
  budget-usdc="{{ budget_usdc | default: 5 }}"
  ship-to="{{ ship_to | default: 'Google Startup Campus, Seoul, KR' | escape }}"
></relay-agent-buy>

<script>
(() => {
  if (customElements.get("relay-agent-buy")) return;

  const template = document.createElement("template");

        margin: 0 0 28px;

    <section class="shell" aria-labelledby="relay-title">

        <p class="intro">
          Delegate the purchase. The buyer agent requests an A2A quote, signs
          autonomously, and settles in USDC on Solana—without Shopify checkout.
        </p>
      </header>

      <div class="brief">
        <div class="brief-cell">
          <span class="meta-key">Product brief</span>

        </div>
        <label class="brief-cell">
          <span class="meta-key">Maximum spend</span>

  class RelayAgentBuy extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      this.attachShadow({ mode: "open" }).append(template.content.cloneNode(true));
      this.$ = (selector) => this.shadowRoot.querySelector(selector);
      this.cluster = "devnet";
      this.walletAddress = "";
      this.identity = null;
      this.authClient = null;
      this.baseUrl = this.cleanBaseUrl(this.getAttribute("agent-base-url") || "");

      const configuredQuery = this.getAttribute("product-query") || "";
      const configuredBudget = this.getAttribute("budget-usdc") || "";
      const configuredShipTo = this.getAttribute("ship-to") || "";
      this.$("#query").textContent = configuredQuery.includes("{{")
        ? "wireless earbuds"
        : (configuredQuery.trim() || "wireless earbuds");
      this.$("#budget").value = configuredBudget.includes("{{")
        ? "5"
        : (configuredBudget.trim() || "5");
      this.$("#ship-to").value = configuredShipTo.trim() || "Google Startup Campus, Seoul, KR";
      this.$("#buy").addEventListener("click", () => this.buy());
      this.$("#auth-button").addEventListener("click", () => this.toggleAuth());
      this.$("#orders-button").addEventListener("click", () => this.loadOrders());
      this.loadWallet();
      this.loadAuth();
    }

    cleanBaseUrl(value) {
      return value.trim().replace(/\/+$/, "");
    }

    isConfigured() {
      return Boolean(this.baseUrl) && !/YOUR-|example\.com/i.test(this.baseUrl);
    }

    async fetchJson(path, options = {}) {
      if (!this.isConfigured()) {
        throw new Error("Set agent-base-url to the public HTTPS buyer-agent URL.");
      }
      let parsedBase;
      try {
        parsedBase = new URL(this.baseUrl);
      } catch {
        throw new Error("agent-base-url is not a valid URL.");
      }
      if (window.location.protocol === "https:" && parsedBase.protocol !== "https:") {
        throw new Error("Shopify requires an HTTPS buyer-agent URL; HTTP is blocked as mixed content.");
      }

      const response = await fetch(this.baseUrl + path, { mode: "cors", ...options });
      const text = await response.text();
      let payload = {};
      try {
        payload = text ? JSON.parse(text) : {};
      } catch {
        throw new Error(text || `Invalid response from ${path}`);
      }
      if (!response.ok) {
        throw new Error(this.errorMessage(payload.detail || payload.reason || `HTTP ${response.status}`));
      }
      if (payload.error) throw new Error(this.errorMessage(payload.error));
      return payload;
    }

    errorMessage(error) {
      if (typeof error === "string") return error;
      if (Array.isArray(error)) {
        return error.map((item) => item.msg || JSON.stringify(item)).join(", ");
      }
      return error?.message || "The agent request failed.";
    }

    short(value, head = 9, tail = 7) {
      const text = String(value ?? "—");
      return text.length > head + tail + 3
        ? `${text.slice(0, head)}…${text.slice(-tail)}`
        : text;
    }

    async loadWallet() {
      if (!this.isConfigured()) {
        this.$("#wallet-state").textContent = "[ CONFIGURE URL ]";
        this.$("#wallet-summary").textContent = "Replace YOUR-TUNNEL with the HTTPS buyer-agent URL";
        return;
      }
      try {
        const balances = await this.fetchJson("/wallet-balances");
        this.cluster = balances.cluster || "devnet";
        this.walletAddress = balances.buyer?.address || "";
        this.$("#wallet-state").textContent = "[ WALLET READY ]";
        this.$("#wallet-summary").textContent =
          `${this.short(this.walletAddress)} · ${balances.buyer?.usdc ?? "—"} USDC · ${balances.buyer?.sol ?? "—"} SOL`;
        this.$("#wallet-summary").title = this.walletAddress;
      } catch (error) {
        this.$("#wallet-state").textContent = "[ WALLET UNAVAILABLE ]";
        this.$("#wallet-summary").textContent = this.errorMessage(error);
      }
    }

    async loadAuthScript() {
      if (window.RelayAuth) return;
      await new Promise((resolve, reject) => {
        const src = `${this.baseUrl}/auth-client.js`;
        const existing = [...document.scripts].find((script) => script.src === src);
        if (existing) {
          existing.addEventListener("load", resolve, { once: true });
          existing.addEventListener("error", reject, { once: true });
          return;
        }
        const script = document.createElement("script");
        script.src = src;
        script.crossOrigin = "anonymous";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Unable to load Relay wallet identity."));
        document.head.append(script);
      });
    }

    updateIdentity(identity) {
      this.identity = identity;
      const wallet = this.$("#human-wallet");
      const authButton = this.$("#auth-button");
      const ordersButton = this.$("#orders-button");
      if (identity?.walletAddress) {
        wallet.textContent = identity.walletAddress;
        wallet.title = identity.walletAddress;
        authButton.textContent = "Sign out";
        ordersButton.disabled = false;
      } else {
        wallet.textContent = "Optional — agent API remains available without sign-in";
        wallet.title = "";
        authButton.textContent = "Wallet sign-in";
        ordersButton.disabled = true;
        this.$("#orders").hidden = true;
      }
    }

    async loadAuth() {
      if (!this.isConfigured()) return;
      try {
        await this.loadAuthScript();
        this.authClient = window.RelayAuth.client(this.baseUrl);
        this.authClient.subscribe((identity) => this.updateIdentity(identity));
        const status = await this.authClient.ready;
        if (!status.configured) {
          this.$("#auth-button").disabled = true;
          this.$("#auth-button").textContent = "Clerk not configured";
        }
      } catch (error) {
        this.$("#auth-button").disabled = true;
        this.$("#human-wallet").textContent = this.errorMessage(error);
      }
    }

    async toggleAuth() {
      try {
        if (!this.authClient) await this.loadAuth();
        if (this.identity) await this.authClient.signOut();
        else await this.authClient.signIn();
      } catch (error) {
        this.$("#human-wallet").textContent = this.errorMessage(error);
      }
    }

    renderOrders(orders) {
      const container = this.$("#orders");
      container.replaceChildren();
      if (!orders.length) {
        container.textContent = "No orders are recorded for this wallet.";
        return;
      }
      orders.forEach((order) => {
        const row = document.createElement("div");
        row.className = "order";
        const title = document.createElement("strong");
        title.textContent = `${order.name} · ${order.title || "Relay order"}`;
        const meta = document.createElement("span");
        meta.textContent = `${order.amount} USDC · ${order.status} · `;
        const link = document.createElement("a");
        link.textContent = "Explorer ↗";
        link.href = order.explorer;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        row.append(title, meta, link);
        container.append(row);
      });
    }

    async loadOrders() {
      const container = this.$("#orders");
      container.hidden = false;
      container.textContent = "Loading wallet orders…";
      try {
        const response = await this.authClient.signedRequest("/my-orders");
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || `HTTP ${response.status}`);
        this.renderOrders(payload.orders || []);
      } catch (error) {
        container.textContent = this.errorMessage(error);
      }
    }

    setRunState(label, kind = "") {
      const state = this.$("#run-state");
      state.textContent = `[ ${label} ]`;
      state.className = `bracket run-state ${kind}`.trim();
    }

    setStep(number, kind, state, message, rows = []) {
      const step = this.$(`[data-step="${number}"]`);
      step.className = `step ${kind}`;
      step.querySelector(".state").textContent = `[ ${state} ]`;
      step.querySelector(".step-message").textContent = message;
      const fields = step.querySelector(".fields");
      fields.replaceChildren();
      rows.forEach(([key, value, title]) => {
        const field = document.createElement("dl");
        const term = document.createElement("dt");
        const detail = document.createElement("dd");
        field.className = "field";
        term.textContent = key;
        detail.textContent = value ?? "—";
        detail.title = title || String(value ?? "—");
        field.append(term, detail);
        fields.append(field);
      });
    }

    resetFlow() {
      const initial = [
        "Shopping agent issues an agent-native Solana Pay request.",
        "Buyer wallet signs without a human approval prompt.",
        "Solana settles the transfer with the order reference.",
        "Shopping agent verifies by reference, then records the paid order.",
      ];
      initial.forEach((message, index) => this.setStep(index + 1, "idle", "QUEUED", message));
      this.$("#proof").hidden = true;
      this.$("#outcome").textContent = "";
      this.$("#raw").textContent = "";
      this.setRunState("IN PROGRESS", "active");
    }

    safeExplorerUrl(value, signature) {
      if (value) {
        try {
          const url = new URL(value);
          if (url.protocol === "https:") return url.href;
        } catch {}
      }
      return signature
        ? `https://explorer.solana.com/tx/${encodeURIComponent(signature)}?cluster=${encodeURIComponent(this.cluster)}`
        : "";
    }

    showProof(signature, explorer) {
      const href = this.safeExplorerUrl(explorer, signature);
      if (!signature || !href) return;
      this.$("#proof").hidden = false;
      this.$("#signature").textContent = signature;
      this.$("#signature").title = signature;
      this.$("#explorer").href = href;
    }

    isOverBudget(result, quote, budget) {
      const price = Number.parseFloat(quote?.price?.amount);
      const reason = String(result?.reason || "");
      return /over.?budget|exceeds budget|budget.*exceed/i.test(reason)
        || (Number.isFinite(price) && price > budget);
    }

    money(price) {
      return price?.amount == null ? "—" : `${price.amount} ${price.currency || "USDC"}`;
    }

    async renderResult(result, budget) {
      const quote = result?.quote || {};
      const payment = result?.payment || {};
      const confirmation = result?.confirmation || {};
      const reason = String(result?.reason || "");
      const hasQuote = Boolean(quote.title || quote.orderRef || quote.reference);
      const overBudget = this.isOverBudget(result, quote, budget);

      if (!hasQuote) {
        throw new Error(reason || "The shopping agent returned no quote.");
      }

      this.setStep(1, overBudget ? "warning" : "done", overBudget ? "GUARDED" : "A2A RECEIVED",
        overBudget ? "The buyer guardrail rejected a quote above the delegated budget."
          : "Quote and agent-native payment request received over A2A.", [
          ["product", quote.title || "—"],
          ["amount", this.money(quote.price)],
          ["payTo", this.short(quote.payTo), quote.payTo],
          ["reference", this.short(quote.reference), quote.reference],
        ]);

      if (overBudget) {
        this.setStep(2, "skipped", "NOT SIGNED", "Budget guardrail stopped the autonomous wallet.");
        this.setStep(3, "skipped", "NOT SENT", "No USDC transfer was broadcast.");
        this.setStep(4, "skipped", "NOT RECORDED", "No settlement was available to verify.");
        this.setRunState("BUDGET GUARD");
        this.$("#outcome").textContent = reason || "Quote exceeded the delegated maximum spend.";
        this.$("#raw").textContent = JSON.stringify(result, null, 2);
        return;
      }

      const signature = payment.txSignature || confirmation.txSignature || "";
      const status = String(confirmation.status || "").toLowerCase();
      const isPaid = status === "paid";
      const isPending = status === "pending";

      this.setStep(2, signature ? "done" : "failed", signature ? "SIGNED" : "NO SIGNATURE",
        signature ? "Buyer wallet signed autonomously; human approval clicks: 0."
          : (reason || "No transaction signature was returned."), [
          ["buyer", this.short(this.walletAddress), this.walletAddress],
          ["approval clicks", "0 · autonomous"],
          ["signature", this.short(signature), signature],
        ]);

      this.setStep(3, signature ? (isPending ? "active" : "done") : "failed",
        signature ? (isPending ? "CONFIRMING" : "ON-CHAIN") : "NOT SENT",
        signature ? "USDC transfer broadcast with the unique order reference."
          : "The transfer could not be shown without a transaction signature.", [
          ["asset", this.money(quote.price)],
          ["network", String(quote.network || this.cluster).toUpperCase()],
          ["reference", this.short(quote.reference), quote.reference],
        ]);

      if (isPaid) {
        this.setStep(4, "done", "PAID", "Reference verified on-chain; Shopify records the order only as a ledger.", [
          ["status", "PAID · VERIFIED"],
          ["orderRef", this.short(confirmation.orderRef || quote.orderRef), confirmation.orderRef || quote.orderRef],
          ["shopifyOrderId", this.short(confirmation.shopifyOrderId), confirmation.shopifyOrderId],
        ]);
        this.setRunState("PAID", "paid");
        this.$("#outcome").textContent =
          "Autonomous purchase complete. The buyer signed and settled without Shopify checkout.";
      } else if (isPending) {
        this.setStep(4, "active", "VERIFYING", "Transfer sent; reference verification is awaiting network confirmation.", [
          ["status", "PENDING"],
          ["orderRef", this.short(confirmation.orderRef || quote.orderRef), confirmation.orderRef || quote.orderRef],
        ]);
        this.setRunState("VERIFYING", "active");
        this.$("#outcome").textContent = "The transaction is live and awaiting devnet confirmation.";
      } else {
        const finalStatus = status || (result?.ok === false ? "failed" : "unknown");
        this.setStep(4, "failed", finalStatus.toUpperCase(),
          reason || `Settlement finished with status: ${finalStatus}.`, [
          ["status", finalStatus.toUpperCase()],
          ["orderRef", this.short(confirmation.orderRef || quote.orderRef), confirmation.orderRef || quote.orderRef],
        ]);
        this.setRunState(finalStatus.toUpperCase());
        this.$("#outcome").textContent = reason || "The settlement was not marked paid.";
      }

      this.showProof(signature, confirmation.explorer || payment.explorer);
      this.$("#raw").textContent = JSON.stringify(result, null, 2);
    }

    renderFailure(error) {
      const message = this.errorMessage(error);
      this.setStep(1, "failed", "FAILED", message);
      this.setStep(2, "skipped", "NOT SIGNED", "The wallet did not sign.");
      this.setStep(3, "skipped", "NOT SENT", "No transfer was broadcast.");
      this.setStep(4, "skipped", "NOT RECORDED", "No paid order was recorded.");
      this.setRunState("FAILED");
      this.$("#outcome").textContent = message;
    }

    async buy() {
      const query = this.$("#query").textContent.trim();
      const budget = Number(this.$("#budget").value);
      const shipTo = this.$("#ship-to").value.trim();
      this.$("#flow").hidden = false;
      this.resetFlow();

      if (!query || !Number.isFinite(budget) || budget <= 0 || !shipTo) {
        this.renderFailure("Enter a positive USDC budget and shipping destination.");
        return;
      }

      const button = this.$("#buy");
      button.disabled = true;
      button.firstElementChild.textContent = "Agent settlement in progress";
      this.setStep(1, "active", "A2A REQUEST", "Requesting a quote within the delegated budget.", [
        ["query", query],
        ["budget", `${budget} USDC`],
        ["shipTo", this.short(shipTo, 14, 10), shipTo],
      ]);

      try {
        const payload = { query, budget, shipTo };
        let result;
        if (this.identity) {
          button.firstElementChild.textContent = "Approve one IntentMandate";
          payload.intentMandate = await this.authClient.signIntent(payload);
          button.firstElementChild.textContent = "Agent settlement in progress";
          const response = await this.authClient.signedRequest("/buy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const responsePayload = await response.json();
          if (!response.ok) {
            throw new Error(this.errorMessage(responsePayload.detail || `HTTP ${response.status}`));
          }
          result = responsePayload;
        } else {
          result = await this.fetchJson("/buy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
        }
        await this.renderResult(result, budget);
      } catch (error) {
        this.renderFailure(error);
      } finally {
        button.disabled = false;
        button.firstElementChild.textContent = "Delegate autonomous purchase";
      }
    }
  }

  customElements.define("relay-agent-buy", RelayAgentBuy);
})();
</script>
