[project]
name = "agentic-broker-agents"
version = "0.1.0"
description = "Buyer + shopping (broker) agents for the Agentic Resell Broker (Google ADK + Gemini)."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "PyJWT[crypto]>=2.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_broker*"]
